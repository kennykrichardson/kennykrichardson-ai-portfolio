<!doctype html>
<html lang="en">
  <head>
    <!-- Character encoding and responsive layout -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090909" />

    <!-- Google Search Console verification -->
    <meta
      name="google-site-verification"
      content="wdpJILycECpySr05_4fzGhK5r75ombkyNRIyUVb9jv8"
    />

    <!-- Primary SEO -->
    <title>Kenny Richardson • AI Portfolio</title>
    <meta
      name="description"
      content="Explore the portfolio of Kenny Richardson, showcasing real-world applications built with artificial intelligence, modern web technologies, and curiosity."
    />
    <meta
      name="keywords"
      content="Kenny Richardson, kennykrichardson, Kenny Richardson Kodipally, AI portfolio, AI Engineer, software developer, web applications, artificial intelligence, React, TypeScript"
    />
    <meta name="author" content="Kenny Richardson" />
    <meta name="creator" content="Kenny Richardson" />
    <meta name="robots" content="index, follow" />

    <!-- Site icons: place these files in the Vite public/ directory -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kenny Richardson • AI Portfolio" />
    <meta property="og:title" content="Kenny Richardson • AI Portfolio" />
    <meta
      property="og:description"
      content="Explore real-world applications built by Kenny Richardson using AI and modern web technologies."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kenny Richardson • AI Portfolio" />
    <meta
      name="twitter:description"
      content="Real-world applications built with AI, modern web technologies, and curiosity."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Structured data: portfolio owner and creator identity -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfilePage",
        "name": "Kenny Richardson • AI Portfolio",
        "mainEntity": {
          "@type": "Person",
          "name": "Kenny Richardson",
          "alternateName": [
            "kennykrichardson",
            "Kenny Richardson Kodipally"
          ],
          "sameAs": [
            "https://github.com/kennykrichardson",
            "https://linkedin.com/in/kennykrichardson"
          ]
        }
      }
    </script>

    <!-- Existing fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
